<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.04" />
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Neural Network Node Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animation Keyframes -->
    <style>
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-3deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.96); }
        50% { opacity: 0.75; transform: scale(1.04); }
        100% { opacity: 0.35; transform: scale(0.96); }
      }
      @keyframes signalFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-node-2 { animation: floatReverse 8s ease-in-out infinite; }
      .pulse-bg { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .flow-line {
        stroke-dasharray: 10, 15;
        animation: signalFlow 4s linear infinite;
      }
      .orbiting {
        transform-origin: 1050px 180px;
        animation: orbit 24s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glow -->
  <circle cx="600" cy="180" r="280" fill="url(#glowPulse)" class="pulse-bg" />
  <circle cx="1050" cy="180" r="140" fill="url(#glowPulse)" class="pulse-bg" style="animation-delay: 2s;" />
  <circle cx="150" cy="180" r="140" fill="url(#glowPulse)" class="pulse-bg" style="animation-delay: 1s;" />

  <!-- Background Isometric Grid Matrix -->
  <g stroke="url(#gridGrad)" stroke-width="1.2">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Dynamic Circuit / Neural Waves (Kept low opacity & behind text) -->
  <g opacity="0.35">
    <path d="M 0,220 Q 300,100 600,220 T 1200,220" fill="none" stroke="#6366f1" stroke-width="2.5" class="flow-line" />
    <path d="M 0,260 Q 300,320 600,260 T 1200,260" fill="none" stroke="#ec4899" stroke-width="2" class="flow-line" style="animation-direction: reverse; animation-duration: 6s;" />
    <path d="M 0,100 Q 300,180 600,100 T 1200,100" fill="none" stroke="#06b6d4" stroke-width="1.5" class="flow-line" style="animation-duration: 5s;" />
  </g>

  <!-- Left Dynamic Element: Futuristic Neural Cluster -->
  <g class="floating-node-1" opacity="0.6">
    <line x1="80" y1="130" x2="130" y2="200" stroke="#818cf8" stroke-width="1.5" />
    <line x1="130" y1="200" x2="90" y2="270" stroke="#818cf8" stroke-width="1.5" />
    <line x1="130" y1="200" x2="200" y2="180" stroke="#a78bfa" stroke-width="1.5" />
    <circle cx="80" cy="130" r="5" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="130" cy="200" r="7" fill="#a855f7" filter="url(#glow)" />
    <circle cx="90" cy="270" r="5" fill="#ec4899" filter="url(#glow)" />
    <circle cx="200" cy="180" r="6" fill="#6366f1" filter="url(#glow)" />
  </g>

  <!-- Right Dynamic Element: Planetary Neural Graph / Tensor Ring -->
  <g opacity="0.65">
    <g class="orbiting">
      <circle cx="1050" cy="100" r="6" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="1130" cy="180" r="7" fill="#ec4899" filter="url(#glow)" />
      <circle cx="1050" cy="260" r="5" fill="#a855f7" filter="url(#glow)" />
      <circle cx="970" cy="180" r="6" fill="#6366f1" filter="url(#glow)" />
      <line x1="1050" y1="100" x2="1130" y2="180" stroke="#60a5fa" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="1130" y1="180" x2="1050" y2="260" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="1050" y1="260" x2="970" y2="180" stroke="#a855f7" stroke-width="1" stroke-dasharray="4,4" />
      <line x1="970" y1="180" x2="1050" y2="100" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,4" />
    </g>
    <!-- Center Core Node -->
    <circle cx="1050" cy="180" r="14" fill="#1e1b4b" stroke="#c084fc" stroke-width="3" filter="url(#glow)" />
    <circle cx="1050" cy="180" r="6" fill="#a855f7" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitle (Guaranteed 100% visible) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 75)">
      <rect x="-165" y="-18" width="330" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2" opacity="0.95" />
      <circle cx="-135" cy="0" r="5" fill="#10b981" />
      <text x="-120" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ENTERPRISE &amp; OPEN-SOURCE ML</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome Machine Learning Frameworks
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#e2e8f0" letter-spacing="0.2">
      Curated Ecosystem for End-to-End MLOps, Deep Learning, LLM Inference &amp; Scalable AI Infrastructure
    </text>

    <!-- Feature Tag Pills -->
    <g transform="translate(600, 275)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="0" y="-15" width="135" height="30" rx="15" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
        <text x="67" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">⚡ Deep Learning</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-165, 0)">
        <rect x="0" y="-15" width="145" height="30" rx="15" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.9" />
        <text x="72" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ddd6fe">🚀 LLM Inference</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="-15" width="145" height="30" rx="15" fill="#1e1b4b" stroke="#ec4899" stroke-width="1.2" opacity="0.9" />
        <text x="72" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#fbcfe8">🛠️ MLOps Engines</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(165, 0)">
        <rect x="0" y="-15" width="155" height="30" rx="15" fill="#1e1b4b" stroke="#0ea5e9" stroke-width="1.2" opacity="0.9" />
        <text x="77" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#bae6fd">🌐 Cloud AI Platforms</text>
      </g>
    </g>
  </g>
</svg>
